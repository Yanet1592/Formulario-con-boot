<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Responsive Verde</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">
        <h2 class="mb-4 text-center text-success">Formulario Responsive Verde</h2>
        <form id="miFormulario" class="row g-3 needs-validation" novalidate>

            <div class="col-12 col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
                <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
            </div>

            <div class="col-12 col-md-6">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" required>
                <div class="invalid-feedback">Por favor ingresa tu apellido.</div>
            </div>

            <div class="col-12">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" required>
                <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>

            <div class="col-12 col-md-6">
                <label for="fecha" class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" id="fecha" required>
                <div class="invalid-feedback">Selecciona tu fecha de nacimiento.</div>
            </div>

            <div class="col-12 col-md-6">
                <label for="pais" class="form-label">País de residencia</label>
                <select class="form-select" id="pais" required>
                    <option selected disabled value="">Elige...</option>
                    <option>Argentina</option>
                    <option>Chile</option>
                    <option>Uruguay</option>
                    <option>Otro</option>
                </select>
                <div class="invalid-feedback">Selecciona un país válido.</div>
            </div>

            <div class="col-12 text-center">
                <button class="btn-enviar" type="submit">Enviar</button>
            </div>
        </form>

        <!-- Mensajes dinámicos -->
        <div id="mensajeError" class="alert alert-danger mt-4 text-center" style="display:none;">
            Campos incompletos. Por favor revise el formulario.
        </div>

        <div id="mensajeGracias" class="alert alert-success mt-4 text-center" style="display:none;">
            ¡Gracias por guardar sus datos!
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS externo -->
    <script src="script.js"></script>

</body>

</html>
